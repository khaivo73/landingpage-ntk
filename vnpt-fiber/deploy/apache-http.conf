# Replace LANDING_HOST after DNS is confirmed. Add a separate vhost only.
<VirtualHost *:80>
    ServerName LANDING_HOST
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader unset X-Forwarded-For
    ProxyAddHeaders On
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/vnpt-acme/.well-known/acme-challenge/
    <Directory /var/www/vnpt-acme>
        Require all granted
    </Directory>
    ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3100/
    ErrorLog ${APACHE_LOG_DIR}/vnpt-fiber-error.log
    CustomLog ${APACHE_LOG_DIR}/vnpt-fiber-access.log combined
</VirtualHost>
