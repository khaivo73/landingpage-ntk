<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body><canvas id="frame"></canvas><script type="module">
import {draw,loadImages} from '/engine.js';
const p=await fetch('/api/render-project/'+new URLSearchParams(location.search).get('job')).then(r=>{if(!r.ok)throw Error('Project unavailable');return r.json()});
const dimensions={portrait:[1080,1920],square:[1080,1080],landscape:[1920,1080]}[p.format];const canvas=document.querySelector('canvas');canvas.width=dimensions[0];canvas.height=dimensions[1];const images=await loadImages(p);window.renderFrame=i=>draw(canvas,p,i/p.fps,images);window.renderFrame(0);window.ready=true;
</script></body></html>
